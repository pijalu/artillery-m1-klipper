#;=================================================================================================================================
#;=============================== MACROS needed for filament manual_changes and pause-resume=======================================
#;=================================================================================================================================

# ===================================================================
# PAUSE - Standard Klipper-compatible pause
# ===================================================================

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
description: Pause print. Parks at collection box, saves state, cools extruder.
  Usage: PAUSE [Z<lift>] [E<retract>] [X<park>] [Y<park>] [R<resume_temp>]
gcode:
    {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}
        M400
        {% set z      = params.Z|default(2)|int %}
        {% set e_retr = (params.E|default(2))|float %}
        {% set x_park = params.X|default(200)|int %}
        {% set y_park = params.Y|default(275)|int %}

        # Only save position if not already at park location
        {% if not ((printer.gcode_move.position.x) <= (x_park+1) and (printer.gcode_move.position.y) >= (y_park-1)) %}
            {% set position = printer.gcode_move.gcode_position %}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_x VALUE="{position.x}"
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_y VALUE="{position.y}"
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_z VALUE="{position.z}"
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_e VALUE="{e_retr}"
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer.extruder.target}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=ntemp VALUE={params.R|default(printer.extruder.target)}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=bed_temp VALUE={printer.heater_bed.target}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=sfan VALUE={printer["fan_generic _Secondary_Fan"].speed*255}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=afan VALUE={printer["fan_generic auxiliary_fan"].speed*255}
            M104 S{params.R|default(printer.extruder.target)|float}
            SAVE_GCODE_STATE NAME=pause_state
            BASE_PAUSE
        {% endif %}

        # Lift Z
        G90
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}
            G1 Z{printer.gcode_move.position.z + z}
        {% endif %}

        # Park at collection box
        M106 S0
        G1 X{x_park} Y{y_park} F6000
        G1 X{x_park - 62} Y{y_park} E-0.5 F6000
        M400

        # Cool down and signal paused
        M104 S0
        M106 P2 S0
        M400
        M300 P1200 S400
        DISABLE_FILAMENT_WIDTH_SENSOR
        SET_IDLE_TIMEOUT TIMEOUT=43200
        RESPOND TYPE=command MSG='[AM1P] State: PAUSE'
    {% else %}
        RESPOND TYPE=echo MSG="Not printing or already paused"
    {% endif %}


# ===================================================================
# RESUME - Standard Klipper-compatible resume
# ===================================================================

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 250
variable_ntemp: 250
variable_bed_temp: 60
variable_saved_x: 0.0
variable_saved_y: 0.0
variable_saved_z: 0.0
variable_saved_e: 0.0
variable_sfan: 0.0
variable_afan: 0.0
description: Resume a paused print. Restores temperatures, position, and state.
gcode:
    {% if printer.pause_resume.is_paused %}
        RESPOND TYPE=command MSG='[AM1P] State: RESUME'
        G90

        # Reheat nozzle
        M109 S{ntemp|int}
        M400

        # Restore fans, sensors, and position
        ENABLE_FILAMENT_WIDTH_SENSOR
        M106 S{sfan}
        M106 P2 S{afan}
        RESTORE_GCODE_STATE NAME=pause_state MOVE=1 MOVE_SPEED=800
        M400

        SET_DISPLAY_TEXT
        M24
        CLEAR_PAUSE
    {% else %}
        RESPOND TYPE=echo MSG="Not in Pause"
    {% endif %}


# ===================================================================
# CANCEL_PRINT - Standard cancel
# ===================================================================

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
description: Cancel print. Retract, cool, park, reset.
gcode:
    RESPOND TYPE=command MSG='[AM1P] State: CANCEL'
    SET_DISPLAY_TEXT
    {% set RUN_VELOCITY = printer.configfile.settings['printer'].max_velocity|float %}
    {% set RUN_ACCEL    = printer.configfile.settings['printer'].max_accel|float %}
    SET_VELOCITY_LIMIT VELOCITY={RUN_VELOCITY} ACCEL={RUN_ACCEL}
    {% set z = params.Z|default(100)|int %}
    {% set x_park = params.X|default(printer.toolhead.axis_minimum.x+5)|int %}
    {% set y_park = params.Y|default(printer.toolhead.axis_minimum.y+5)|int %}

    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    SDCARD_RESET_FILE
    CLEAR_PAUSE
    M400
    M220 S100
    M221 S100
    G91
    M83
    G1 E-1.0 F1200
    TURN_OFF_HEATERS
    M107                    ; turn off P0 (part fan), P1 (auxiliary), P2 (filter)
    M106 P3 S0              ; turn off filter_fan (not covered by M107)
    M141 S0                 ; chamber heater off
    {% if (printer.gcode_move.position.z + 5) < z %}
        G90
        G0 X{x_park} Y{y_park} Z{z + 5} F6000
    {% else %}
        {% if (printer.gcode_move.position.z + 5) < printer.toolhead.axis_maximum.z %}
            G91
            G1 Z5 F300
            G90
            G0 X{x_park} Y{y_park} F6000
        {% else %}
            G90
            G0 X{x_park} Y{y_park} Z{printer.toolhead.axis_maximum.z} F6000
        {% endif %}
    {% endif %}
    M84


# ===================================================================
# FILAMENT_CHANGE - In-print filament swap
# ===================================================================

[gcode_macro FILAMENT_CHANGE]
description: Filament change during print. Cuts filament at cutter mechanism.
gcode:
    RESET_FILAMENT_WIDTH_SENSOR
    # NOTE: Cutter mechanism coordinates — do NOT modify without verifying hardware limits.
    # X262.7 is within position_max=265.0 but close to edge.
    # Y-0.5 is within position_min=-2.0 but close to front endstop.
    {% set s = (printer["gcode_macro RESUME"].etemp)|float %}
    {% set r = (printer["gcode_macro RESUME"].ntemp)|float %}
    {% if s > 180 %}
        M104 S{(printer["gcode_macro RESUME"].etemp)|float}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-2} MAXIMUM={s+2}
        G90
        G1 X200 Y260 F6000
        G1 X260 Y30 F6000
        G1 X260 F6000
        M400
        G1 X262.7 Y30 F600     ; cut filament
        M400
        G1 X262.7 Y-0.5 F600   ; engage cutter
        M400
        G92 E0
        G1 E-3 F600
        M400
        G91
        G1 X-10 F600
        M400
        G90
        G1 X200 Y260 F6000
        G1 X200 Y275 F6000
        G1 X160 Y275 F6000
        G1 X137 Y275 F3000
        M400
        G92 E0
        G1 E-80 F600
        M400
        M104 S{(printer["gcode_macro RESUME"].ntemp)|float}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={r-2} MAXIMUM={r+2}
    {% endif %}


# ===================================================================
# FILAMENT_UNLOAD - Standalone filament unload (not during print)
# ===================================================================

[gcode_macro FILAMENT_UNLOAD]
description: Unload filament outside of a print. Moves to collection box and retracts.
  Usage: FILAMENT_UNLOAD TEMP=<temp>
gcode:
    {% set temp = params.TEMP|default(0)|int %}
    {% if temp < 180 %}
        RESPOND TYPE=echo MSG="Temperature too low. Set TEMP >= 180."
    {% else %}
        unload_filament TEMP={temp}
    {% endif %}


# ===================================================================
# FILAMENT_LOAD - Standalone filament load (not during print)
# ===================================================================

[gcode_macro FILAMENT_LOAD]
description: Load filament outside of a print. Moves to collection box, extrudes and purges.
  Usage: FILAMENT_LOAD TEMP=<temp>
gcode:
    {% set temp = params.TEMP|default(0)|int %}
    {% if temp < 180 %}
        RESPOND TYPE=echo MSG="Temperature too low. Set TEMP >= 180."
    {% else %}
        load_filament TEMP={temp}
    {% endif %}


# ===================================================================
# M109 (overridden) - During pause, triggers FILAMENT_CHANGE
# ===================================================================

[gcode_macro M109]
rename_existing: M99109
description: Wait for extruder temperature. During pause without F flag, triggers FILAMENT_CHANGE.
gcode:
    {% set flag = params.F|default(FALSE) %}
    {% set unload_temp_val = (printer["gcode_macro _USER_VARIABLES"].unload_temp)|float %}
    {% set unload_flag_val = (printer["gcode_macro _USER_VARIABLES"].unload_flag)|int %}

    {% if printer.pause_resume.is_paused and printer.idle_timeout.state == "Ready" %}
        {% if flag %}
            {% set s = params.S|float %}
            M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-2} MAXIMUM={s+2}
        {% else %}
            FILAMENT_CHANGE
        {% endif %}
    {% else %}
        {% if unload_flag_val == 0 %}
            {% set s = params.S|float %}
            M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
            {% if s != 0 %}
                TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-2} MAXIMUM={s+2}
            {% endif %}
        {% endif %}
    {% endif %}
