# ===================================
# Artillery M1 - Print and LCD macros
# ===================================
# NOTE: [save_variables] and [respond] are defined in printer.cfg.
# Do NOT add duplicate sections here — Klipper will reject them.

# Minimal _USER_VARIABLES - holds unload state for screen-based filament operations
[gcode_macro _USER_VARIABLES]
variable_unload_flag: 0
variable_unload_temp: 0
gcode:

# ===================================================================
# _CHOICE_VALIDATE_MESH - Fluidd UI for mesh validation tolerance
# ===================================================================

[gcode_macro _CHOICE_VALIDATE_MESH]
description: Set max deviation tolerance for mesh validation
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin VALIDATE MESH OPTION"
    RESPOND TYPE=command MSG="action:prompt_text  Set the maximum deviation tolerance for mesh validation."
    RESPOND TYPE=command MSG="action:prompt_button +/-0.03| SAVE_VARIABLE VARIABLE=max_deviation VALUE='0.03'|primary"
    RESPOND TYPE=command MSG="action:prompt_button +/-0.04| SAVE_VARIABLE VARIABLE=max_deviation VALUE='0.04'|primary"
    RESPOND TYPE=command MSG="action:prompt_button +/-0.05| SAVE_VARIABLE VARIABLE=max_deviation VALUE='0.05'|primary"
    RESPOND TYPE=command MSG="action:prompt_button +/-0.06| SAVE_VARIABLE VARIABLE=max_deviation VALUE='0.06'|primary"
    RESPOND TYPE=command MSG="action:prompt_button +/-0.07| SAVE_VARIABLE VARIABLE=max_deviation VALUE='0.07'|primary"
    RESPOND TYPE=command MSG="action:prompt_button +/-0.08| SAVE_VARIABLE VARIABLE=max_deviation VALUE='0.08'|primary"
    RESPOND TYPE=command MSG="action:prompt_button NO_TEST| SAVE_VARIABLE VARIABLE=max_deviation VALUE='0'|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

# ===================================================================
# _init_start - Print initialization
# ===================================================================

[gcode_macro _init_start]
description: Initialize printer for print start: reset rates, limits, positioning, filament sensor
gcode:
    RESPOND TYPE=command MSG='[AM1P] State: INIT_START'
    ENABLE_FILAMENT_WIDTH_SENSOR
    CLEAR_PAUSE

    M106 S0                   ; part fan off
    M141 S0                   ; chamber heater off
    M106 P2 S0                ; filter fan off
    M106 P1 S0                ; auxiliary fan off
    M106 P3 S0                ; (unused) reserved
    M220 S100                 ; reset feedrate
    M221 S100                 ; reset flowrate
    SET_VELOCITY_LIMIT VELOCITY=500 ACCEL=6000 MINIMUM_CRUISE_RATIO=0.2 SQUARE_CORNER_VELOCITY=5
    G21                       ; millimeters
    G90                       ; absolute positioning

# ===================================================================
# _heat_chamber - Chamber heating
# ===================================================================

[gcode_macro _heat_chamber]
description: Heat chamber to target. PTC and chamber fans engage automatically.
gcode:
    RESPOND TYPE=command MSG='[AM1P] State: HEAT_CHAMBER'
    {% set temp_chamber = params.CHAMBER_TEMP|int %}
    {% if temp_chamber != 0 %}
        M106 P1 S255
        M106 P2 S60
        G4 P5000
        {% if temp_chamber >= 47 %}
            M191 S47
        {% endif %}
        M141 S{temp_chamber}
    {% endif %}

# ===================================================================
# _nozzle_clean - Nozzle cleaning cycle
# ===================================================================

[gcode_macro _nozzle_clean]
description: Full nozzle clean: heat, extrude, scrape, brush, seal, cool
gcode:
    RESPOND TYPE=command MSG='[AM1P] State: NOZZLE_CLEAN'
    {% set temp = params.TEMP|default(230)|int %}

    # Pre-position if cold
    {% if printer.extruder.target < 180 %}
        M104 S140
        G28
        G90
        G1 X200 Y275 F6000
        G1 X137 Y275 F3000
        M400
    {% endif %}

    # Heat and extrude
    M109 S{temp}
    M83
    G1 E40 F300
    M400

    # Cool-extrude-cool cycle
    G1 E40 F250
    G1 E-2 F600
    M400
    M106 S120
    G4 P1000
    M109 S{temp - 20}

    # Scrape at discharge port
    M106 S160
    G4 P1000
    G1 X170 Y275 F30000
    G1 X138 Y275 F3000
    G1 X170 Y275 F30000
    G1 X138 Y275 F3000
    G1 X170 Y275 F30000
    M106 S0
    M400

    # Brush nozzle on plate
    M106 S255
    G4 P1000
    G1 X153 Y269.5 Z5 F2000
    G1 X153 Y269.5 Z0.5 F3000
    G1 X186 Y269.5 Z0.5 F3000
    G1 X153 Y269 Z0.5 F3000
    G1 X186 Y269 Z0.5 F3000
    G1 X153 Y268.5 Z0.5 F3000
    G1 X186 Y268.5 Z0.5 F3000
    M400
    G1 Z3 F300
    M400

    # Seal and cool down
    M106 S220
    M104 S{temp - 50}
    G1 X193 Y269 Z2 F3000
    M400
    G1 X193 Y269 Z1 F1000
    G1 X200 Y269 Z0 F80
    G1 X205 Y269 Z0 F80
    M400
    # NOTE: Z-0.2 intentionally presses nozzle into build surface to seal tip.
    # This is within position_min=-5.0 but risks bed damage if mesh has positive offset here.
    G1 X205 Y269 Z-0.2 F60
    M109 S140
    G1 X215 Y269 Z1 F600
    G1 Z5 F3000
    M400
    M106 S150

# ===================================================================
# _prime_line - Nozzle blob purge with wipe line
# ===================================================================

[gcode_macro _prime_line]
description: Extrude a blob at the purge point, then lay a zigzag wipe line along the front edge
gcode:
    RESPOND TYPE=command MSG='[AM1P] State: PRIME'
    M83                         ; relative extrusion
    G92 E0

    # Move to purge position and kick away old blob
    G1 Z5 F200
    G1 X1 F3000
    G1 Y50 F3000
    G1 Z0.5 F200
    G1 X1 F6000
    G1 Y1 F9000
    G1 Z5 F200

    # Extrude blob
    G1 Z0.6 F200
    G1 E25 F300
    G4 P1000
    G1 E-0.200 Z5 F600

    # Wipe line (zigzag pattern)
    G1 X64
    G1 Z0.4 F200
    G1 X155 F600 E10
    G1 Y2
    G1 X67 F1800 E10
    G1 Y3
    M106 S255
    G1 X153 F1800 E10
    G1 E-3 F3000
    M106 S255

    G92 E0                      ; reset extruder
    M82                         ; absolute extrusion
    G1 Z2.0 F3000

# ===================================================================
# MANUAL_LEVEL - Full bed leveling with heating
# ===================================================================

[gcode_macro MANUAL_LEVEL]
description: Adaptive bed leveling with heating. Heats bed, cleans nozzle, homes, runs ADAPTIVE mesh.
  Usage: MANUAL_LEVEL [BED_TEMP=<temp>] [NOZZLE_TEMP=140]
  NOTE: Runs BED_MESH_CALIBRATE ADAPTIVE=1 (partial mesh over print area), not a full mesh.
gcode:
    {% set bed_temp    = params.BED_TEMP|default(printer.heater_bed.target)|float %}
    {% set nozzle_temp = params.NOZZLE_TEMP|default(140)|int %}

    RESPOND TYPE=command MSG='[AM1P] State: LEVEL'

    # Heat bed if target provided
    {% if bed_temp > 0 %}
        RESPOND TYPE=command MSG='[AM1P] State: HEAT_BED'
        M140 S{bed_temp}
        M190 S{bed_temp}
    {% endif %}

    # Clean nozzle at safe temperature
    RESPOND TYPE=command MSG='[AM1P] State: NOZZLE_CLEAN'
    _nozzle_clean TEMP={nozzle_temp}

    # Home and mesh
    RESPOND TYPE=command MSG='[AM1P] State: HOMING'
    G28

    RESPOND TYPE=command MSG='[AM1P] State: MESH'
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1

    RESPOND TYPE=command MSG='[AM1P] State: LEVEL_DONE'
    G0 Z10 F1800
    G0 X170 Y175 F12000

# ===================================================================
# _unload_filament - Move to collection box and retract filament
# ===================================================================

[gcode_macro _unload_filament]
description: Move to collection box and unload filament. Requires temperature.
  Usage: _unload_filament TEMP=<temp>
gcode:
    {% set temp = params.TEMP|default(0)|int %}
    {% if temp < 180 %}
        RESPOND TYPE=echo MSG="Temperature too low. Set TEMP >= 180."
    {% else %}
        RESPOND TYPE=command MSG='[AM1P] State: FILAMENT_UNLOAD'
        M109 S{temp}
        _move_to_collection_box
        M83
        G1 E-80 F600
        M400
        M104 S140
    {% endif %}

# ===================================================================
# _load_filament - Move to collection box, extrude and purge filament
# ===================================================================

[gcode_macro _load_filament]
description: Move to collection box, load and purge filament. Requires temperature.
  Usage: _load_filament TEMP=<temp>
gcode:
    {% set temp = params.TEMP|default(0)|int %}
    {% if temp < 180 %}
        RESPOND TYPE=echo MSG="Temperature too low. Set TEMP >= 180."
    {% else %}
        RESPOND TYPE=command MSG='[AM1P] State: FILAMENT_LOAD'
        M109 S{temp}
        _move_to_collection_box
        M83
        G1 E80 F300
        M400
        # Purge and clean
        M106 S160
        G4 P1000
        G1 X170 Y275 F30000
        G1 X138 Y275 F3000
        G1 X170 Y275 F30000
        G1 X138 Y275 F3000
        G1 X195 Y275 F30000
        M400
        M106 S0
        M104 S140
    {% endif %}
