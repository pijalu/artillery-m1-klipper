# ================================================================
# FULL EVENT-DRIVEN FILAMENT MANAGEMENT SYSTEM (FIXED + COMPLETE)
# - Restores collection box moves
# - Restores nozzle cleaning
# - Uses prompt UI
# - Keeps async sensor logic
# - Correct temperature sequencing
# ================================================================


# ================================================================
# SENSOR STATE
# ================================================================

[gcode_macro _FILAMENT_SENSOR_STATE]
variable_mode: "idle"
variable_callback: ""
gcode:

[gcode_macro _FILAMENT_POPUP]
description: Show a filament change message
gcode:
    {% set message = params.MSG|default("Pop-up!") %}
    RESPOND TYPE=command MSG="action:prompt_begin Filament Change"
    RESPOND TYPE=command MSG="{ 'action:prompt_text ' ~ message }"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _FILAMENT_POPUP_CLOSE]
description: Close popup window
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"

# ================================================================
# SENSOR POLLER
# ================================================================

[delayed_gcode _FILAMENT_SENSOR_POLL]
gcode:
    {% set state = printer["gcode_macro _FILAMENT_SENSOR_STATE"] %}
    {% set mode = state.mode %}
    {% set d = printer.hall_filament_width_sensor.Diameter %}

    {% if mode == "insert" %}
        {% if d > 0.5 %}
            RESPOND TYPE=echo MSG="Filament detected"
            _FILAMENT_POPUP_CLOSE
            SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSOR_STATE VARIABLE=mode VALUE='"idle"'
            {% if state.callback|length > 0 %}
                {state.callback}
            {% endif %}
        {% else %}
            RESPOND TYPE=echo MSG="No Filament detected"
            UPDATE_DELAYED_GCODE ID=_FILAMENT_SENSOR_POLL DURATION=1
        {% endif %}

    {% elif mode == "remove" %}
        {% if d < 0.5 %}
            RESPOND TYPE=echo MSG="Filament removed"
            _FILAMENT_POPUP_CLOSE
            SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSOR_STATE VARIABLE=mode VALUE='"idle"'
            {% if state.callback|length > 0 %}
                {state.callback}
            {% endif %}
        {% else %}
            RESPOND TYPE=echo MSG="Filament removed"
            UPDATE_DELAYED_GCODE ID=_FILAMENT_SENSOR_POLL DURATION=1
        {% endif %}
    {% endif %}


# ================================================================
# SENSOR WAIT HELPERS
# ================================================================
[gcode_macro _WAIT_FOR_INSERT]
gcode:
    SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSOR_STATE VARIABLE=mode VALUE='"insert"'
    UPDATE_DELAYED_GCODE ID=_FILAMENT_SENSOR_POLL DURATION=1
    _FILAMENT_POPUP MSG="Waiting for filament insert"

[gcode_macro _WAIT_FOR_REMOVE]
gcode:
    SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSOR_STATE VARIABLE=mode VALUE='"remove"'
    UPDATE_DELAYED_GCODE ID=_FILAMENT_SENSOR_POLL DURATION=1
    _FILAMENT_POPUP MSG="Waiting for filament removal"


# ================================================================
# PAUSE
# ================================================================

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
variable_saved_x: 0
variable_saved_y: 0
variable_saved_z: 0
variable_etemp: 0

gcode:
    {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}

        {% if printer.toolhead.homed_axes != "xyz" %}
            RESPOND TYPE=error MSG="Printer not homed"
            RETURN
        {% endif %}

        {% set zhop = params.Z|default(2)|float %}
        {% set pos = printer.toolhead.position %}

        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=saved_x VALUE={pos.x}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=saved_y VALUE={pos.y}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=saved_z VALUE={pos.z}
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=etemp VALUE={printer.extruder.target}

        SAVE_GCODE_STATE NAME=pause_state
        BASE_PAUSE

        G91
        G1 E-0.5 F1800
        G1 Z{zhop} F600
        G90

        _move_to_collection_box

        M104 S0
        SET_IDLE_TIMEOUT TIMEOUT=43200
        RESPOND TYPE=command MSG='[AM1P] State: PAUSE'
    {% else %}
        RESPOND TYPE=echo MSG="Not printing or already paused"
    {% endif %}


# ================================================================
# RESUME
# ================================================================

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% if printer.pause_resume.is_paused %}
        RESPOND TYPE=command MSG='[AM1P] State: RESUME'
        {% set x = printer["gcode_macro PAUSE"].saved_x %}
        {% set y = printer["gcode_macro PAUSE"].saved_y %}
        {% set z = printer["gcode_macro PAUSE"].saved_z %}
        {% set etemp = printer["gcode_macro PAUSE"].etemp %}
        M109 S{etemp|int}

        G90
        G1 X{x} Y{y} F6000
        G1 Z{z} F600
        M400

        SET_FILAMENT_SENSOR SENSOR=hall_filament_width_sensor ENABLE=1
        RESTORE_GCODE_STATE NAME=pause_state MOVE=0
        BASE_RESUME
   {% else %}
        RESPOND TYPE=error MSG="Not in Pause" 
    {% endif %}


# ===================================================================
# CANCEL_PRINT - Standard cancel
# ===================================================================
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
description: Cancel print. Retract, cool, park, reset.
gcode:
    RESPOND TYPE=command MSG='[AM1P] State: CANCEL'
    SET_DISPLAY_TEXT
    {% set RUN_VELOCITY = printer.configfile.settings['printer'].max_velocity|float %}
    {% set RUN_ACCEL    = printer.configfile.settings['printer'].max_accel|float %}
    SET_VELOCITY_LIMIT VELOCITY={RUN_VELOCITY} ACCEL={RUN_ACCEL}
    {% set z = params.Z|default(100)|int %}
    {% set x_park = params.X|default(printer.toolhead.axis_minimum.x+5)|int %}
    {% set y_park = params.Y|default(printer.toolhead.axis_minimum.y+5)|int %}

    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    SDCARD_RESET_FILE
    CLEAR_PAUSE
    M400
    M220 S100
    M221 S100
    G91
    M83
    G1 E-1.0 F1200
    TURN_OFF_HEATERS
    M107                    ; turn off P0 (part fan), P1 (auxiliary), P2 (filter)
    M106 P3 S0              ; turn off filter_fan (not covered by M107)
    M141 S0                 ; chamber heater off
    {% if (printer.gcode_move.position.z + 5) < z %}
        G90
        G0 X{x_park} Y{y_park} Z{z + 5} F6000
    {% else %}
        {% if (printer.gcode_move.position.z + 5) < printer.toolhead.axis_maximum.z %}
            G91
            G1 Z5 F300
            G90
            G0 X{x_park} Y{y_park} F6000
        {% else %}
            G90
            G0 X{x_park} Y{y_park} Z{printer.toolhead.axis_maximum.z} F6000
        {% endif %}
    {% endif %}
    M84

# ================================================================
# FILAMENT LOAD (EVENT-DRIVEN WITH PROMPT)
# ================================================================

[gcode_macro _FILAMENT_LOAD_STATE]
variable_temp: 0
gcode:

[gcode_macro FILAMENT_LOAD]
gcode:
    {% set temp = params.TEMP|default(220)|int %}
    {% if temp < 180 %}
        RESPOND TYPE=error MSG="Temperature too low. Set TEMP >= 180."
    {% else %}
        RESPOND TYPE=command MSG='[AM1P] State: FILAMENT_LOAD'

        SET_GCODE_VARIABLE MACRO=_FILAMENT_LOAD_STATE VARIABLE=temp VALUE={temp}

        SMARTHOME

        # set temp (do not wait - we will move)
        M104 S{temp}

        _move_to_collection_box
        M109 S{temp}

        # user interactions
        RESPOND TYPE=echo MSG="Filament load to start"
        RESPOND TYPE=command MSG="action:prompt_begin Filament Load"
        RESPOND TYPE=command MSG="action:prompt_text Hotend ready at collection box."
        RESPOND TYPE=command MSG="action:prompt_text Click Start and insert filament."
        RESPOND TYPE=command MSG="action:prompt_button Start|_FILAMENT_LOAD_RUN|primary"
        RESPOND TYPE=command MSG="action:prompt_button Cancel|_FILAMENT_LOAD_CANCEL|warning"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _FILAMENT_LOAD_RUN]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=echo MSG="Waiting for filament insertion..."
    SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSOR_STATE VARIABLE=callback VALUE='"_AFTER_INSERT_LOAD"'
    _WAIT_FOR_INSERT

[gcode_macro _AFTER_INSERT_LOAD]
gcode:
    {% set temp = printer["gcode_macro _FILAMENT_LOAD_STATE"].temp %}

    RESPOND TYPE=echo MSG="Loading filament..."

    M83
    G1 E80 F300
    M400

    M106 S120
    G4 P1000

    M109 S{temp - 20}
    M104 S140
    G4 P1000

    _nozzle_clean_scrape
    _move_out_of_collection_box

    SET_FILAMENT_SENSOR SENSOR=hall_filament_width_sensor ENABLE=1
    RESPOND TYPE=echo MSG="Enabled filament runout"
    M104 S0
    M106 S0

    RESPOND TYPE=echo MSG="Filament load complete."

[gcode_macro _FILAMENT_LOAD_CANCEL]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    SET_FILAMENT_SENSOR SENSOR=hall_filament_width_sensor ENABLE=1
    RESPOND TYPE=echo MSG="Enabled filament runout"
    M104 S0
    M106 S0


# ================================================================
# FILAMENT SWITCH (EVENT-DRIVEN WITH PROMPT)
# ================================================================

[gcode_macro _FILAMENT_SWITCH_STATE]
variable_temp: 220
variable_autoresume: 1
gcode:

[gcode_macro FILAMENT_UNLOAD]
description: Unload filament outside of a print.
  Usage: FILAMENT_UNLOAD TEMP=<temp>
gcode:
    {% set temp = params.TEMP|default(220)|int %}
    {% if temp < 180 %}
        RESPOND TYPE=error MSG="Temperature too low. Set TEMP >= 180."
    {% else %}
       RESPOND TYPE=command MSG='[AM1P] State: FILAMENT_UNLOAD'

       SMARTHOME
       # _cut_filament TEMP={temp}
       _unload_filament TEMP={temp}
       M104 S0
    {% endif %}

[gcode_macro _cut_filament]
description: Cut filament helper.
gcode:
    {% set temp = params.TEMP|default(220)|int %}
    RESPOND TYPE=echo MSG="Cutting filament"
    M104 S{temp}
    G90
    # Move to cut zone
    G1 X200 Y260 F6000
    G1 X260 Y30 F6000
    G1 X260 F6000    
    M400

    # Let's not wait for now
    # TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp-5} MAXIMUM={temp+10}

    G1 X262.7 Y30 F600     ; cut filament
    M400
    G1 X262.7 Y-0.5 F600   ; engage cutter
    M400
    G92 E0
    G1 E-3 F600
    M400
    G91
    G1 X-10 F600
    M400
    G90


[gcode_macro _unload_filament]
description: Unload filament helper.
gcode:
    {% set temp = params.TEMP|default(220)|int %}
    {% set d = printer.hall_filament_width_sensor.Diameter %}

    {% if d > 0.5 %}
        # Disable sensor during unload
        SET_FILAMENT_SENSOR SENSOR=hall_filament_width_sensor ENABLE=0
        RESPOND TYPE=echo MSG="Disabled filament runout"

        RESPOND TYPE=echo MSG="Filament detected: unloading"
        
        # Cut filament
        _cut_filament TEMP={temp}

        # Go for the collect box
        M104 S{temp}
        _move_to_collection_box
        M109 S{temp}

        M83
        G1 E-80 F600
        M400

        M106 S120
        G4 P1000

        M109 S{temp - 20}
        M104 S140

        _nozzle_clean_scrape
        _move_out_of_collection_box
    {% else %}
        RESPOND TYPE=echo MSG="No Filament detected - no unload"
    {% endif %}

[gcode_macro FILAMENT_SWITCH]
gcode:
    {% set temp = params.TEMP|default(220)|int %}
    {% set autoresume = params.AUTORESUME|default(1)|int %}

    RESPOND TYPE=command MSG='[AM1P] State: FILAMENT_SWITCH temp={temp}'

    SET_GCODE_VARIABLE MACRO=_FILAMENT_SWITCH_STATE VARIABLE=temp VALUE={temp}
    SET_GCODE_VARIABLE MACRO=_FILAMENT_SWITCH_STATE VARIABLE=autoresume VALUE={autoresume}

    {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}
        PAUSE
    {% endif %}

    _unload_filament TEMP={temp}

    RESPOND TYPE=command MSG="action:prompt_begin Filament Switch"
    RESPOND TYPE=command MSG="action:prompt_text Filament unloaded."
    RESPOND TYPE=command MSG="action:prompt_text Click Start, remove old and insert new filament."
    RESPOND TYPE=command MSG="action:prompt_button Start|_FILAMENT_SWITCH_RUN|primary"
    RESPOND TYPE=command MSG="action:prompt_button Abort|_FILAMENT_SWITCH_ABORT|warning"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _FILAMENT_SWITCH_RUN]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"

    RESPOND TYPE=echo MSG="Waiting for filament removal..."
    SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSOR_STATE VARIABLE=callback VALUE='"_AFTER_REMOVE_SWITCH"'
    _WAIT_FOR_REMOVE

[gcode_macro _AFTER_REMOVE_SWITCH]
gcode:
    RESPOND TYPE=echo MSG="Insert new filament..."
    SET_GCODE_VARIABLE MACRO=_FILAMENT_SENSOR_STATE VARIABLE=callback VALUE='"_AFTER_INSERT_SWITCH"'
    _WAIT_FOR_INSERT

[gcode_macro _AFTER_INSERT_SWITCH]
gcode:
    {% set temp = printer["gcode_macro _FILAMENT_SWITCH_STATE"].temp %}
    {% set autoresume = printer["gcode_macro _FILAMENT_SWITCH_STATE"].autoresume %}

    M104 S{temp}
    _move_to_collection_box
    M109 S{temp}

    RESPOND TYPE=echo MSG="Purging..."

    M83
    G1 E80 F300
    M400

    # Cool down / seal
    M106 S120
    M109 S{temp - 20}

    # Match temp
    M104 S{temp}

    _nozzle_clean_scrape
    _move_out_of_collection_box

    SET_FILAMENT_SENSOR SENSOR=hall_filament_width_sensor ENABLE=1
    RESPOND TYPE=echo MSG="Enabled filament runout"

    RESPOND TYPE=echo MSG="Filament switch complete."

    {% if autoresume == 1 and printer.pause_resume.is_paused %}
        RESUME
    {% else %}
        # stop heating
        M104 S0
    {% endif %}

[gcode_macro _FILAMENT_SWITCH_ABORT]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    
    SET_FILAMENT_SENSOR SENSOR=hall_filament_width_sensor ENABLE=1
    RESPOND TYPE=echo MSG="Enabled filament runout"
    
    M104 S0
    M106 S0


# ================================================================
# TOOL MACROS
# ================================================================

[gcode_macro T0]
gcode: FILAMENT_SWITCH

[gcode_macro T1]
gcode: FILAMENT_SWITCH

[gcode_macro T2]
gcode: FILAMENT_SWITCH

[gcode_macro T3]
gcode: FILAMENT_SWITCH

[gcode_macro T4]
gcode: FILAMENT_SWITCH

[gcode_macro T5]
gcode: FILAMENT_SWITCH

[gcode_macro T6]
gcode: FILAMENT_SWITCH

[gcode_macro T7]
gcode: FILAMENT_SWITCH