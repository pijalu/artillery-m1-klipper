# =================================
# Artillery M1 - General macros
# =================================

[gcode_macro m300]
description: Emits an audible beep.
  Usage: M300 [P<duration>] [S<frequency>]
gcode:
    {% set settings = printer.configfile.settings %}
    {% if "output_pin beeper" in printer %}
        {% set P = (params.P|default(100)|int, 0)|max %}
        {% set S = (params.S|default(1000)|int, 10000)|min %}
        SET_PIN PIN=beeper VALUE={
            settings["output_pin beeper"].scale|default(1.0) * 0.5
          }{% if settings["output_pin beeper"].pwm %} CYCLE_TIME={
            1.0 / S }{% endif %}
        G4 P{P}
        SET_PIN PIN=beeper VALUE=0
    {% else %}
        {action_respond_info(
           "M300 is disabled. To enable create an [output_pin beeper] config.")}
    {% endif %}


[gcode_macro M141]
description: Set chamber temperature without waiting.
  Usage: M141 S<temp>
gcode:
    {% set temp = (params.S|default(0)|int, 0)|max %}
    {% if temp > 0 %}
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET="{temp}"
    {% else %}
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0
    {% endif %}


[gcode_macro M191]
description: Set chamber temperature and wait.
  Usage: M191 S<temp>
gcode:
    {% set s = params.S|float %}
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET={s}
    {% if s == 0 %}
        # Chamber heater off; PTC fan (_ptc_fan) is auto-controlled by [heater_fan], do not override
    {% else %}
        TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={s-2} MAXIMUM={s+2}
    {% endif %}

[homing_override]
# Safe parking positions after homing — NOT actual homed positions.
# set_position tells Klipper where the toolhead IS after homing completes.
# These values place the nozzle near center-bed at a safe Z height.
set_position_z: 254
set_position_x: 130
set_position_y: 130
gcode:
    {% set X_HOME = printer.configfile.settings['stepper_x'].position_endstop|int %}
    {% set Y_HOME = printer.configfile.settings['stepper_y'].position_endstop|int %}
    {% set X_TARGET = params.X|default(X_HOME + 132)|int %}
    {% set Y_TARGET = params.Y|default(Y_HOME + 132)|int %}
    {% set RUN_CUR = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set keys_str = params.keys()|join('') %}

    {% set has_z = 'Z' in keys_str or 'z' in keys_str %}
    {% set has_x = 'X' in keys_str or 'x' in keys_str %}
    {% set has_y = 'Y' in keys_str or 'y' in keys_str %}

    {% macro home_axis(axis) -%}
        {% set stepper = 'stepper_' ~ axis %}
        SET_TMC_CURRENT STEPPER={stepper} CURRENT=0.7
        M400
        G28 {axis}
        G91
        G1 {axis}5 F3000
        M400
        G90
        SET_TMC_CURRENT STEPPER={stepper} CURRENT={RUN_CUR}
    {%- endmacro %}

    {% if has_z or (params|length == 1) %}
        M106 S0
        G91
        G1 Z5 F120
        G90

        # Double homing X/Y for sensorless endstop repeatability.
        # First pass triggers stall, second pass confirms position.
        { home_axis('y') }
        { home_axis('x') }
        { home_axis('y') }
        { home_axis('x') }

        G1 X{X_TARGET} Y{Y_TARGET} F3000
        G28 Z
        G1 Z10 F300

    {% else %}
        # Partial homing — double-pass for repeatability
        {% if has_y %}
        { home_axis('y') }
        {% endif %}
        {% if has_x %}
        { home_axis('x') }
        {% endif %}
        {% if has_y %}
        { home_axis('y') }
        {% endif %}
        {% if has_x %}
        { home_axis('x') }
        {% endif %}
    {% endif %}
    M400
    G90

# Virtual SD card hook — called automatically when a print starts from the SD card.
# This is NOT a user-facing macro; use SLICER_START_PRINT for manual start.
[gcode_macro _PRINT_START_HOOK]
gcode:
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=True
    G92 E0
    G90
    CLEAR_PAUSE
    M117 Printing

[gcode_macro PRINT_END]
gcode:
    RESPOND TYPE=command MSG='[AM1P] State: PRINT_END'
    {% set RUN_VELOCITY = printer.configfile.settings['printer'].max_velocity|float %}
    {% set RUN_ACCEL    = printer.configfile.settings['printer'].max_accel|float %}
    SET_VELOCITY_LIMIT VELOCITY={RUN_VELOCITY} ACCEL={RUN_ACCEL}
    M220 S100
    M221 S100
    {% set z = params.Z|default(100)|int %}
    {% if (printer.gcode_move.position.z+5) < z %}
        G90
        G1 Z{z+5} F6000
    {% endif %}
    TURN_OFF_HEATERS
    M107
    M84


[gcode_macro M106]
description: Turn on fan and set speed.
  Usage: M106 [P<fan_index>] [S<speed>]
  Fan mapping: P0=part_fan, P1=auxiliary_fan, P2=filter_fan, P3=_Secondary_Fan
rename_existing: M1066
gcode:
    {% set p = params.P|int if params.P is defined else 0 %}
    {% set speed = (params.S|float / 255 if params.S is defined else 1.0) %}
    {% if p == 0 %}
        M1066 S{speed*255}
    {% elif p == 1 %}
        SET_FAN_SPEED FAN=auxiliary_fan SPEED={speed}
    {% elif p == 2 %}
        SET_FAN_SPEED FAN=filter_fan SPEED={speed}
    {% elif p == 3 %}
        SET_FAN_SPEED FAN=_Secondary_Fan SPEED={speed}
    {% endif %}

[gcode_macro M107]
description: Turn off all fans
rename_existing: M1077
gcode:
    M106 P0 S0
    M106 P1 S0
    M106 P2 S0
    M106 P3 S0

[gcode_macro G29]
description: Bed leveling with adaptive mesh via MANUAL_LEVEL
gcode:
    {% set bed_temp = params.S|default(60)|float %}
    MANUAL_LEVEL BED_TEMP={bed_temp} NOZZLE_TEMP=140

[gcode_macro G30]
description: Single Z probe calibration
gcode:
    G28
    PROBE_CALIBRATE

####################################################################
#	Homing and Gantry Adjustment Routines
#####################################################################
[idle_timeout]
timeout: 7200
gcode:
    {% if printer.extruder.temperature > 140 %}
        {action_respond_info("Extruder powered down on idle timeout.")}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={120}
        M84 E
    {% else %}
        TURN_OFF_HEATERS
        M84 E
    {% endif %}

[gcode_macro da_tilt]
gcode:
    G28
    screws_tilt_calculate
    M84

[gcode_macro M17]
description: Enable steppers
  Usage: M17 [X] [Y] [Z] [E]
gcode:
    {% if 'X' in params or 'Y' in params or 'Z' in params or 'E' in params %}
        {% if 'X' in params %}
            SET_STEPPER_ENABLE STEPPER=stepper_x enable=1
        {% endif %}
        {% if 'Y' in params %}
            SET_STEPPER_ENABLE STEPPER=stepper_y enable=1
        {% endif %}
        {% if 'Z' in params %}
            SET_STEPPER_ENABLE STEPPER=stepper_z enable=1
        {% endif %}
        {% if 'E' in params %}
            SET_STEPPER_ENABLE STEPPER=extruder enable=1
        {% endif %}
    {% else %}
        SET_STEPPER_ENABLE STEPPER=stepper_x enable=1
        SET_STEPPER_ENABLE STEPPER=stepper_y enable=1
        SET_STEPPER_ENABLE STEPPER=stepper_z enable=1
        SET_STEPPER_ENABLE STEPPER=extruder enable=1
    {% endif %}


[delayed_gcode _LOAD_MESH_PROFILE]
initial_duration: 3.0
gcode:
    BED_MESH_PROFILE LOAD=default

[gcode_macro M205]
description: Sets square corner velocity.
  Usage: M205 [X<velocity>] [Y<velocity>]
gcode:
    {% set max_square_corner_velocity = 30 %}
    {% if 'X' in params or 'Y' in params %}
        SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY="{(params.X|default(0)|float, params.Y|default(0)|float, max_square_corner_velocity)|min}"
    {% else %}
        SET_VELOCITY_LIMIT
    {% endif %}


[gcode_macro M203]
description: Sets maximum velocity.
  Usage: M203 [X<velocity>] [Y<velocity>]
gcode:
    {% if 'X' in params or 'Y' in params %}
        {% set velocity = (params.X|default(params.Y)|float,
                           params.Y|default(params.X)|float, 500)|min %}
        SET_VELOCITY_LIMIT VELOCITY="{velocity}"
    {% else %}
        SET_VELOCITY_LIMIT
    {% endif %}

[gcode_macro M190]
description: Wait for bed temperature.
rename_existing: M99190
gcode:
    {% set s = params.S|float %}
    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-2} MAXIMUM={s+2}
    {% endif %}

# ===================================================================
# Movement helpers - collection box positioning
# ===================================================================

[gcode_macro _move_to_collection_box]
gcode:
    {% if printer.idle_timeout.state == "Idle" %}
        G28
    {% endif %}
    M400
    G90
    G1 X200 Y260 F6000
    G1 X200 Y275 F6000
    G1 X160 Y275 F6000
    G1 X137 Y275 F3000
    M400

[gcode_macro _move_to_collection_box_no_g28]
gcode:
    G90
    M400
    G1 X200 Y260 F6000
    G1 X200 Y275 F6000
    G1 X160 Y275 F6000
    G1 X137 Y275 F3000
    M400


[gcode_macro EMERGENCY_RETRACT]
description: Emergency filament retraction when hot end is above 280C.
  WARNING: Performs G28 X Y while hot — risk of oozing/burns. Use only in emergencies.
gcode:
    {% set temp = printer.extruder.target %}
    {% if temp > 280 %}
        M83
        G1 E-5 F600
        G1 E10 F600
        G28 X Y
        G1 X50 Y150 F6000
        G1 E-5 F600
        G1 E10 F600
        G1 E-200 F600
    {% endif %}

[gcode_macro STEPPER_MONITOR]
gcode:
    RESPOND PREFIX="Stepper Status - " MSG="x"
    DUMP_TMC STEPPER=stepper_x
    RESPOND PREFIX="Stepper Status - " MSG="y"
    DUMP_TMC STEPPER=stepper_y
    RESPOND PREFIX="Stepper Status - " MSG="z"
    DUMP_TMC STEPPER=stepper_z
    RESPOND PREFIX="Stepper Status - " MSG="queried"
