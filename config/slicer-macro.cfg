# ===================================
# Artillery M1 - Slicer Start Macro
# ===================================
#
# Minimal slicer start gcode example:
#   SLICER_START_PRINT BED_TEMP=[bed_temperature_initial_layer_single] CHAMBER_TEMP=[chamber_temperature] EXTRUDER_TEMP=[first_layer_temperature[initial_extruder]] AUTOLEVEL=1 SHAPER=0
#
# Parameters (all optional, sensible defaults):
#   BED_TEMP    - Bed temperature (0 = skip heating)
#   CHAMBER_TEMP- Chamber target temperature (0 = skip)
#   EXTRUDER_TEMP- Nozzle temperature for cleaning & first layer
#   AUTOLEVEL   - 0: skip mesh, 1: run adaptive bed mesh, 2: validate existing mesh
#   SHAPER      - 0: skip, 1: run SHAPER_CALIBRATE
#

[gcode_macro SLICER_START_PRINT]
description: Main print start. Heat -> Clean -> Level (optional) -> Shaper (optional) -> Prime
gcode:
    {% set bed_temp      = params.BED_TEMP|default(60)|float %}
    {% set chamber_temp  = params.CHAMBER_TEMP|default(0)|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(230)|float %}
    {% set autolevel     = params.AUTOLEVEL|default(1)|int %}
    {% set shaper        = params.SHAPER|default(0)|int %}

    RESPOND TYPE=command MSG='[AM1P] Config: bed={bed_temp}C chamber={chamber_temp}C nozzle={extruder_temp}C autolevel={autolevel} shaper={shaper}'

    _init_start
    # --- Heat chamber (if needed) ---
    {% if chamber_temp > 0 %}
        _heat_chamber CHAMBER_TEMP={chamber_temp}
    {% endif %}

    # --- Heat bed ---
    {% if bed_temp > 0 %}
        RESPOND TYPE=command MSG='[AM1P] State: HEAT_BED'
        M140 S{bed_temp}
        M190 S{bed_temp}
    {% endif %}

     # --- Home ---
    RESPOND TYPE=command MSG='[AM1P] State: HOMING'
    G28

    # --- Clean nozzle ---
    nozzle_clean TEMP={extruder_temp}

    # --- Bed leveling / validation ---
    {% if autolevel == 1 %}
        RESPOND TYPE=command MSG='[AM1P] State: MESH'
        BED_MESH_CLEAR
        BED_MESH_CALIBRATE ADAPTIVE=1
    {% elif autolevel == 2 %}
        RESPOND TYPE=command MSG='[AM1P] State: MESH_VALIDATE'
        BED_MESH_PROFILE LOAD=default
        {% set svv = printer.save_variables.variables %}
        {% set max_dev = svv.max_deviation|default(0.05)|float %}
        {% if max_dev > 0 %}
            VALIDATE_BED_MESH MAX_DEVIATION={max_dev}
        {% endif %}
    {% endif %}

    # --- Shaper calibration (optional) ---
    {% if shaper == 1 %}
        RESPOND TYPE=command MSG='[AM1P] State: SHAPER'
        SHAPER_CALIBRATE
    {% endif %}

    # --- Home Preprint ---
    RESPOND TYPE=command MSG='[AM1P] State: HOMING_PREPRINT'
    G28

    # --- Heat nozzle to print temp ---
    RESPOND TYPE=command MSG='[AM1P] State: HEAT_NOZZLE'
    # Move to purge position
    G1 Z5 F200
    G1 X1 F3000
    G1 Y50 F3000

    M106 S120
    G4 P500
    M109 S{extruder_temp}
    M106 S0

    # --- Prime line ---
    _prime_line

    RESPOND TYPE=command MSG='[AM1P] State: READY'

# ===================================================================
# SLICER_END_PRINT - Standard print end sequence
# ===================================================================

[gcode_macro SLICER_END_PRINT]
description: Standard print end sequence. Retract -> Park -> Cool down -> Disable steppers
gcode:
    RESPOND TYPE=command MSG='[AM1P] State: PRINT_END'

    # --- Retract filament ---
    M400
    G91
    G1 E-0.6 F1800
    G90

    # --- Raise Z-axis ---
    {% set current_z = printer.gcode_move.position.z|float %}
    {% set lift_z = (current_z + 2, 50)|min %}
    G90
    G1 Z{lift_z} F300

    # --- Move to safe position ---
    G1 X260 Y250 F3600
    M400

    # --- Take timelapse frame (if available) ---
    {% if printer['gcode_macro TIMELAPSE_TAKE_FRAME'] is defined %}
        TIMELAPSE_TAKE_FRAME
    {% endif %}

    # --- Raise Z further if below 50mm ---
    {% if current_z < 50 %}
        G1 Z50 F300
    {% endif %}

    # --- Cooling sequence ---
    M400
    M106 S255           ; part fan full speed
    M141 S0             ; chamber heater off
    M106 P1 S255        ; auxiliary fan full speed
    M104 S160           ; nozzle cooldown target
    G4 P10000           ; wait 10 seconds
    M109 S160           ; wait until nozzle reaches 160°C

    # --- Fans off ---
    M106 S0             ; part fan off
    M141 S0             ; chamber heater off
    M106 P2 S0          ; filter fan off
    M106 P1 S0          ; auxiliary fan off
    M106 P3 S0          ; (unused) reserved fan off

    # --- Reset feedrate and flow ---
    M220 S100
    M221 S100

    # --- Reset velocity limits to defaults ---
    {% set max_vel = printer.configfile.settings['printer'].max_velocity|float %}
    {% set max_accel = printer.configfile.settings['printer'].max_accel|float %}
    SET_VELOCITY_LIMIT VELOCITY={max_vel} ACCEL={max_accel} MINIMUM_CRUISE_RATIO=0.2 SQUARE_CORNER_VELOCITY=5

    # --- Units and heaters off ---
    G21                 ; set units to millimeters
    M104 S0             ; nozzle heater off
    M140 S0             ; bed heater off

    # --- Final wait and disable steppers ---
    M400
    M84 X Y Z E         ; disable all steppers
    M400

    RESPOND TYPE=command MSG='[AM1P] State: PRINT_END_DONE'
