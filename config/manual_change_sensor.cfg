#;=================================================================================================================================
#;=============================== MACROS needed for filament manual_changes and pause-resume=======================================
#;=================================================================================================================================

# ===================================================================
# PAUSE - Standard Klipper-compatible pause
# ===================================================================

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
description: Pause print. Parks at collection box, saves state, cools extruder.
  Usage: PAUSE [Z<lift>] [E<retract>] [X<park>] [Y<park>] [R<resume_temp>]
gcode:
    {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}
        M400
        {% set z      = params.Z|default(2)|int %}
        {% set e_retr = (params.E|default(2))|float %}
        {% set x_park = params.X|default(200)|int %}
        {% set y_park = params.Y|default(275)|int %}

        # Only save position if not already at park location
        {% if not ((printer.gcode_move.position.x) <= (x_park+1) and (printer.gcode_move.position.y) >= (y_park-1)) %}
            {% set position = printer.gcode_move.gcode_position %}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_x VALUE="{position.x}"
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_y VALUE="{position.y}"
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_z VALUE="{position.z}"
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_e VALUE="{e_retr}"
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer.extruder.target}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=ntemp VALUE={params.R|default(printer.extruder.target)}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=bed_temp VALUE={printer.heater_bed.target}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=sfan VALUE={printer["fan_generic _Secondary_Fan"].speed*255}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=afan VALUE={printer["fan_generic auxiliary_fan"].speed*255}
            M104 S{params.R|default(printer.extruder.target)|float}
            SAVE_GCODE_STATE NAME=pause_state
            BASE_PAUSE
        {% endif %}

        # Lift Z
        G90
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}
            G1 Z{printer.gcode_move.position.z + z}
        {% endif %}

        # Park at collection box
        M106 S0
        G1 X{x_park} Y{y_park} F6000
        G1 X{x_park - 62} Y{y_park} E-0.5 F6000
        M400

        # Cool down and signal paused
        M104 S0
        M106 P2 S0
        M400
        M300 P1200 S400
        DISABLE_FILAMENT_WIDTH_SENSOR
        SET_IDLE_TIMEOUT TIMEOUT=43200
        RESPOND TYPE=command MSG='[AM1P] State: PAUSE'
    {% else %}
        RESPOND TYPE=echo MSG="Not printing or already paused"
    {% endif %}


# ===================================================================
# RESUME - Standard Klipper-compatible resume
# ===================================================================

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 250
variable_ntemp: 250
variable_bed_temp: 60
variable_saved_x: 0.0
variable_saved_y: 0.0
variable_saved_z: 0.0
variable_saved_e: 0.0
variable_sfan: 0.0
variable_afan: 0.0
description: Resume a paused print. Restores temperatures, position, and state.
gcode:
    {% if printer.pause_resume.is_paused %}
        RESPOND TYPE=command MSG='[AM1P] State: RESUME'
        G90

        # Reheat nozzle
        M109 S{ntemp|int}
        M400

        # Restore fans, sensors, and position
        ENABLE_FILAMENT_WIDTH_SENSOR
        M106 S{sfan}
        M106 P2 S{afan}
        RESTORE_GCODE_STATE NAME=pause_state MOVE=1 MOVE_SPEED=800
        M400

        SET_DISPLAY_TEXT
        M24
        CLEAR_PAUSE
    {% else %}
        RESPOND TYPE=echo MSG="Not in Pause"
    {% endif %}


# ===================================================================
# CANCEL_PRINT - Standard cancel
# ===================================================================

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
description: Cancel print. Retract, cool, park, reset.
gcode:
    RESPOND TYPE=command MSG='[AM1P] State: CANCEL'
    SET_DISPLAY_TEXT
    {% set RUN_VELOCITY = printer.configfile.settings['printer'].max_velocity|float %}
    {% set RUN_ACCEL    = printer.configfile.settings['printer'].max_accel|float %}
    SET_VELOCITY_LIMIT VELOCITY={RUN_VELOCITY} ACCEL={RUN_ACCEL}
    {% set z = params.Z|default(100)|int %}
    {% set x_park = params.X|default(printer.toolhead.axis_minimum.x+5)|int %}
    {% set y_park = params.Y|default(printer.toolhead.axis_minimum.y+5)|int %}

    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    SDCARD_RESET_FILE
    CLEAR_PAUSE
    M400
    M220 S100
    M221 S100
    G91
    M83
    G1 E-1.0 F1200
    TURN_OFF_HEATERS
    M107
    M106 P3 S0
    M141 S0
    {% if (printer.gcode_move.position.z + 5) < z %}
        G90
        G0 X{x_park} Y{y_park} Z{z + 5} F6000
    {% else %}
        {% if (printer.gcode_move.position.z + 5) < printer.toolhead.axis_maximum.z %}
            G91
            G1 Z5 F300
            G90
            G0 X{x_park} Y{y_park} F6000
        {% else %}
            G90
            G0 X{x_park} Y{y_park} Z{printer.toolhead.axis_maximum.z} F6000
        {% endif %}
    {% endif %}
    M84


# ===================================================================
# FILAMENT_CHANGE - In-print filament swap (slicer T0-T7 triggered)
# ===================================================================

[gcode_macro FILAMENT_CHANGE]
description: Filament change during print. Cuts filament at cutter mechanism.
gcode:
    RESET_FILAMENT_WIDTH_SENSOR
    {% set s = (printer["gcode_macro RESUME"].etemp)|float %}
    {% set r = (printer["gcode_macro RESUME"].ntemp)|float %}
    {% if s > 180 %}
        M104 S{(printer["gcode_macro RESUME"].etemp)|float}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-2} MAXIMUM={s+2}
        G90
        G1 X200 Y260 F6000
        G1 X260 Y30 F6000
        G1 X260 F6000
        M400
        G1 X262.7 Y30 F600
        M400
        G1 X262.7 Y-0.5 F600
        M400
        G92 E0
        G1 E-3 F600
        M400
        G91
        G1 X-10 F600
        M400
        G90
        G1 X200 Y260 F6000
        G1 X200 Y275 F6000
        G1 X160 Y275 F6000
        G1 X137 Y275 F3000
        M400
        G92 E0
        G1 E-80 F600
        M400
        M104 S{(printer["gcode_macro RESUME"].ntemp)|float}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={r-2} MAXIMUM={r+2}
    {% endif %}


# ===================================================================
# FILAMENT_UNLOAD - Standalone filament unload (not during print)
# ===================================================================

[gcode_macro FILAMENT_UNLOAD]
description: Unload filament outside of a print.
  Usage: FILAMENT_UNLOAD TEMP=<temp>
gcode:
    {% set temp = params.TEMP|default(0)|int %}
    {% if temp < 180 %}
        RESPOND TYPE=echo MSG="Temperature too low. Set TEMP >= 180."
    {% else %}
        unload_filament TEMP={temp}
    {% endif %}


# ===================================================================
# Filament sensor helpers
# ===================================================================
#
# DETECT_DIA threshold: empty sensor reads ~1.46 mm, loaded ~1.75 mm.
# 1.5 mm sits comfortably between both — adjust in _FILAMENT_WAIT_INSERT
# and _FILAMENT_WAIT_REMOVE if your sensor calibration differs.
#
# The for-loop polling pattern is appropriate here because it runs
# headlessly after the user has already dismissed the prompt — it does
# not block the UI.  Each iteration dwells 1 s; 300 iterations = 5 min
# safety timeout.  The {% if not done %} guard short-circuits all
# remaining iterations the moment the condition is met.

[gcode_macro _FILAMENT_WAIT_INSERT]
description: Headless loop — dwells until hall sensor diameter exceeds 1.5 mm or 5 min timeout.
gcode:
    {% set done = false %}
    {% for i in range(300) %}
        {% if not done %}
            {% if printer.hall_filament_width_sensor.Diameter > 1.5 %}
                {% set done = true %}
            {% else %}
                G4 P1000
            {% endif %}
        {% endif %}
    {% endfor %}
    {% if not done %}
        RESPOND TYPE=echo MSG="Filament insert timeout — no filament detected after 5 min."
        M300 P800 S300
    {% endif %}

[gcode_macro _FILAMENT_WAIT_REMOVE]
description: Headless loop — dwells until hall sensor diameter drops below 1.5 mm or 5 min timeout.
gcode:
    {% set done = false %}
    {% for i in range(300) %}
        {% if not done %}
            {% if printer.hall_filament_width_sensor.Diameter < 1.5 %}
                {% set done = true %}
            {% else %}
                G4 P1000
            {% endif %}
        {% endif %}
    {% endfor %}
    {% if not done %}
        RESPOND TYPE=echo MSG="Filament remove timeout — filament still detected after 5 min."
        M300 P800 S300
    {% endif %}


# ===================================================================
# FILAMENT_LOAD - Prompt then headless sensor-gated load
# ===================================================================
# 1. Heat hotend + move to collection box
# 2. Prompt: "Ready — click Start to begin loading"
# 3. _FILAMENT_LOAD_RUN (button callback):
#    a. Insert instruction via RESPOND
#    b. _FILAMENT_WAIT_INSERT loop until filament detected
#    c. Extrude, purge, clean, cool
#
# Usage: FILAMENT_LOAD TEMP=<temp>

[gcode_macro _FILAMENT_LOAD_STATE]
variable_temp: 0
gcode:

[gcode_macro FILAMENT_LOAD]
description: Heat, park, prompt to confirm ready, then load filament automatically when sensor detects insertion.
  Usage: FILAMENT_LOAD TEMP=<temp>
gcode:
    {% set temp = params.TEMP|default(0)|int %}
    {% if temp < 180 %}
        RESPOND TYPE=echo MSG="Temperature too low. Set TEMP >= 180."
    {% else %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_LOAD_STATE VARIABLE=temp VALUE={temp}
        RESPOND TYPE=command MSG='[AM1P] State: FILAMENT_LOAD'
        SMARTHOME
        M104 S{temp}
        _move_to_collection_box
        M109 S{temp}
        M300 P200 S800
        G4 P200
        M300 P200 S800
        RESPOND TYPE=command MSG="action:prompt_begin Load filament"
        RESPOND TYPE=command MSG="action:prompt_text Hotend is at temperature and parked at the collection box."
        RESPOND TYPE=command MSG="action:prompt_text Click Start when you are ready to insert the filament."
        RESPOND TYPE=command MSG="action:prompt_button Start|_FILAMENT_LOAD_RUN|primary"
        RESPOND TYPE=command MSG="action:prompt_button Cancel|_FILAMENT_LOAD_CANCEL|warning"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _FILAMENT_LOAD_RUN]
description: Called by the FILAMENT_LOAD prompt. Runs headlessly — inserts, detects, extrudes.
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set temp = printer["gcode_macro _FILAMENT_LOAD_STATE"].temp|int %}
    RESPOND TYPE=echo MSG="Insert filament now — waiting for sensor..."
    _FILAMENT_WAIT_INSERT
    RESPOND TYPE=echo MSG="Filament detected — loading..."
    M300 P400 S1000
    M83
    G1 E80 F300
    M400
    M106 S120
    G4 P1000
    M109 S{temp - 20}
    M104 S140
    G4 P1000
    _nozzle_clean_scrape
    _move_out_of_collection_box
    M104 S0
    M106 S0
    RESPOND TYPE=echo MSG="Filament load complete."
    M300 P200 S1000
    G4 P150
    M300 P200 S1000

[gcode_macro _FILAMENT_LOAD_CANCEL]
description: Called by the FILAMENT_LOAD cancel button.
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    M104 S0
    M106 S0
    RESPOND TYPE=echo MSG="Filament load cancelled."


# ===================================================================
# FILAMENT_SWITCH - Prompt then headless sensor-gated mid-print swap
# ===================================================================
# 1. Pause print (if active), heat + unload current filament
# 2. Prompt: "Ready — click Start to begin the swap"
# 3. _FILAMENT_SWITCH_RUN (button callback):
#    a. _FILAMENT_WAIT_REMOVE loop until old filament gone
#    b. Heat back up
#    c. _FILAMENT_WAIT_INSERT loop until new filament detected
#    d. Extrude/purge, resume (if AUTORESUME=1)
#
# Usage: FILAMENT_SWITCH [TEMP=<temp>] [AUTORESUME=1]

[gcode_macro _FILAMENT_SWITCH_STATE]
variable_temp: 220
variable_autoresume: 1
gcode:

[gcode_macro FILAMENT_SWITCH]
description: Pause, unload, prompt to confirm ready, then swap filament automatically via sensor.
  Usage: FILAMENT_SWITCH [TEMP=<temp>] [AUTORESUME=1]
gcode:
    {% if params.TEMP is defined %}
        {% set temp = params.TEMP|int %}
    {% elif printer.extruder.target > 180 %}
        {% set temp = printer.extruder.target|int %}
    {% elif printer["gcode_macro RESUME"].etemp > 180 %}
        {% set temp = printer["gcode_macro RESUME"].etemp|int %}
    {% else %}
        {% set temp = 220 %}
    {% endif %}
    {% set autoresume = params.AUTORESUME|default(1)|int %}
    SET_GCODE_VARIABLE MACRO=_FILAMENT_SWITCH_STATE VARIABLE=temp        VALUE={temp}
    SET_GCODE_VARIABLE MACRO=_FILAMENT_SWITCH_STATE VARIABLE=autoresume  VALUE={autoresume}
    RESPOND TYPE=command MSG='[AM1P] State: FILAMENT_SWITCH temp={temp}'
    {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}
        PAUSE
    {% endif %}
    RESPOND TYPE=echo MSG="Unloading current filament..."
    M104 S{temp}
    _move_to_collection_box
    M109 S{temp}
    M83
    G1 E-80 F600
    M400
    M106 S120
    G4 P1000
    M109 S{temp - 20}
    M104 S140
    _nozzle_clean_scrape
    _move_out_of_collection_box
    M300 P300 S600
    G4 P200
    M300 P300 S600
    G4 P200
    M300 P300 S600
    RESPOND TYPE=command MSG="action:prompt_begin Filament switch"
    RESPOND TYPE=command MSG="action:prompt_text Filament has been unloaded. The hotend is cooling."
    RESPOND TYPE=command MSG="action:prompt_text Click Start when you are ready to pull out the old filament and insert the new one."
    RESPOND TYPE=command MSG="action:prompt_button Start|_FILAMENT_SWITCH_RUN|primary"
    RESPOND TYPE=command MSG="action:prompt_button Abort|_FILAMENT_SWITCH_ABORT|warning"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _FILAMENT_SWITCH_RUN]
description: Called by the FILAMENT_SWITCH prompt. Runs headlessly — removes old, inserts new, purges, resumes.
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set temp       = printer["gcode_macro _FILAMENT_SWITCH_STATE"].temp|int %}
    {% set autoresume = printer["gcode_macro _FILAMENT_SWITCH_STATE"].autoresume|int %}
    # Step 1 — wait for old filament to be pulled out
    RESPOND TYPE=echo MSG="Pull out the old filament now — waiting for sensor..."
    _FILAMENT_WAIT_REMOVE
    RESPOND TYPE=echo MSG="Old filament removed. Insert new filament now — waiting for sensor..."
    M300 P300 S800
    # Step 2 — reheat and wait for new filament insertion
    M104 S{temp}
    _move_to_collection_box
    M109 S{temp}
    _FILAMENT_WAIT_INSERT
    # Step 3 — purge and resume
    RESPOND TYPE=echo MSG="New filament detected — purging..."
    M300 P400 S1200
    M83
    G1 E80 F300
    M400
    M106 S120
    G4 P1000
    M109 S{temp - 20}
    M104 S{temp}
    _nozzle_clean_scrape
    _move_out_of_collection_box
    M300 P200 S1000
    G4 P150
    M300 P200 S1000
    RESPOND TYPE=echo MSG="Filament switch complete."
    {% if autoresume == 1 and printer.pause_resume.is_paused %}
        RESPOND TYPE=echo MSG="Resuming print..."
        RESUME
    {% else %}
        RESPOND TYPE=echo MSG="Print is paused — run RESUME when ready."
    {% endif %}

[gcode_macro _FILAMENT_SWITCH_ABORT]
description: Called by the FILAMENT_SWITCH abort button.
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    M104 S0
    M106 S0
    RESPOND TYPE=echo MSG="Filament switch aborted. Print remains paused — run RESUME or CANCEL_PRINT."


# ===================================================================
# T0–T7 — Manual filament change tool macros
# ===================================================================

[gcode_macro T0]
description: Pause print and change to tool 0 (filament change cycle)
gcode:
    PAUSE
    FILAMENT_CHANGE

[gcode_macro T1]
description: Pause print and change to tool 1 (filament change cycle)
gcode:
    PAUSE
    FILAMENT_CHANGE

[gcode_macro T2]
description: Pause print and change to tool 2 (filament change cycle)
gcode:
    PAUSE
    FILAMENT_CHANGE

[gcode_macro T3]
description: Pause print and change to tool 3 (filament change cycle)
gcode:
    PAUSE
    FILAMENT_CHANGE

[gcode_macro T4]
description: Pause print and change to tool 4 (filament change cycle)
gcode:
    PAUSE
    FILAMENT_CHANGE

[gcode_macro T5]
description: Pause print and change to tool 5 (filament change cycle)
gcode:
    PAUSE
    FILAMENT_CHANGE

[gcode_macro T6]
description: Pause print and change to tool 6 (filament change cycle)
gcode:
    PAUSE
    FILAMENT_CHANGE

[gcode_macro T7]
description: Pause print and change to tool 7 (filament change cycle)
gcode:
    PAUSE
    FILAMENT_CHANGE
